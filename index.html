<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Набор в команду «Белая Шапка»</title>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@500;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#121b16;--panel:#1b2820;--line:#2e4034;--text:#f3f3ea;--mute:#9db0a3;--acc:#f2c500;--err:#ff7a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:500 17px/1.5 Manrope,system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:20px 18px 40px}
h1,h2{font-family:'Russo One',Impact,sans-serif;font-weight:400;line-height:1.1;margin:0}
h1{font-size:2.1rem}
h2{font-size:1.55rem;margin-bottom:18px}
.screen{display:none}.screen.on{display:block}
.hero img{width:100%;border-radius:14px;display:block;margin-bottom:22px;border:2px solid var(--line)}
.hero p{color:var(--mute);margin:12px 0 26px}
.btn{display:block;width:100%;padding:15px 18px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:700;text-align:left;cursor:pointer;margin-bottom:10px}
.btn:hover{border-color:var(--acc)}
.btn.sel{border-color:var(--acc);background:#2a3320}
.go{background:var(--acc);color:#16190f;border-color:var(--acc);text-align:center;font-family:'Russo One',Impact,sans-serif;font-weight:400;font-size:1.15rem;margin-top:18px}
.go:hover{border-color:var(--text)}
.go[disabled]{opacity:.35;cursor:not-allowed}
.ghost{background:transparent;text-align:center}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chips .btn{text-align:center;margin:0;padding:14px 0;font-size:1.1rem}
input,textarea{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
input:focus,textarea:focus,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
textarea{min-height:130px;resize:vertical}
.err{color:var(--err);font-weight:700;margin-top:14px}
.count{color:var(--mute);font-size:.9rem;margin-top:8px}
.back{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:6px 0;margin-top:14px}
pre{white-space:pre-wrap;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:.95rem;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 {k:'age',q:'Сколько тебе лет?',t:'age'},
 {k:'hasMask',q:'Есть ли у тебя маска?',t:'choice',o:['Да','Нет']},
 {k:'mask',q:'Какого персонажа маска?',t:'choice',o:MASKS,skip:function(){return A.hasMask!=='Да'}},
 {k:'maskOther',q:'Напиши, какая у тебя маска',t:'text',ph:'Название персонажа',skip:function(){return A.hasMask!=='Да'||A.mask!=='Другой персонаж'}},
 {k:'name',q:'Как тебя зовут?',t:'text',ph:'Имя'},
 {k:'exp',q:'Есть ли у тебя опыт съёмок или монтажа?',t:'choice',o:['Да, снимал(а) раньше','Немного','Нет, но хочу научиться']},
 {k:'role',q:'Чем ты хочешь заниматься в команде?',t:'choice',o:['Играть роль перед камерой','Снимать на камеру','Монтировать видео','Придумывать сценарии','Пока не знаю']},
 {k:'why',q:'Почему ты хочешь в нашу команду?',t:'area',ph:'Расскажи своими словами'},
 {k:'when',q:'Когда ты готов сниматься?',t:'choice',o:['В будни после школы','По выходным','В любое время','Пока не знаю']},
 {k:'kind',q:'Будешь ли ты добр к коллективу?',t:'choice',o:['Да, всегда','Стараюсь быть добрым','Зависит от настроения']}
];
var i=0,hist=[];
var $=function(id){return document.getElementById(id)};
function show(id){['start','quiz','done'].forEach(function(s){$(s).classList.toggle('on',s===id)});window.scrollTo(0,0)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function wc(v){return (v||'').trim().split(/\s+/).filter(Boolean).length}
function valid(){var s=steps[i],v=A[s.k];if(s.t==='area')return wc(v)>=20;if(s.t==='text')return !!v&&v.trim().length>=2;return !!v}
function refresh(){$('next').disabled=!valid()}
function render(){
 var s=steps[i],b=$('body');b.innerHTML='';$('err').textContent='';
 $('q').textContent=s.q;
 var shown=steps.filter(function(x){return !x.skip||!x.skip()});
 $('bar').style.width=((shown.indexOf(s))/shown.length*100)+'%';
 $('back').style.display=hist.length?'inline-block':'none';
 $('next').textContent=(i===steps.length-1)?'Готово':'Дальше';
 if(s.t==='choice'||s.t==='age'){
  var wrap=s.t==='age'?el('div','chips'):b,opts=s.t==='age'?[11,12,13,14,15,16,17,18]:s.o;
  opts.forEach(function(o){var bt=el('button','btn'+(String(A[s.k])===String(o)?' sel':''),String(o));bt.type='button';
   bt.onclick=function(){A[s.k]=String(o);[].forEach.call(wrap.children,function(c){c.classList.remove('sel')});bt.classList.add('sel');$('err').textContent='';
    if(s.k==='city'&&o!=='Павлодар'){$('err').textContent='Набор доступен только для жителей Павлодара.'}
    refresh()};wrap.appendChild(bt)});
  if(wrap!==b)b.appendChild(wrap);
 }else{
  var f=el(s.t==='area'?'textarea':'input');f.placeholder=s.ph||'';f.maxLength=s.t==='area'?500:40;f.value=A[s.k]||'';
  var cnt=null;if(s.t==='area'){cnt=el('div','count');b.appendChild(f);b.appendChild(cnt)}else b.appendChild(f);
  var upd=function(){if(cnt)cnt.textContent='Слов: '+wc(f.value)+' из 20 минимум'};
  f.oninput=function(){A[s.k]=f.value;upd();refresh()};upd();
 }
 if(s.k==='city'&&A.city&&A.city!=='Павлодар')$('err').textContent='Набор доступен только для жителей Павлодара.';
 refresh();
}
function advance(){
 i++;while(i<steps.length&&steps[i].skip&&steps[i].skip()){delete A[steps[i].k];i++}
 if(i>=steps.length)return finish();
 render();
}
$('startBtn').onclick=function(){i=0;hist=[];show('quiz');render()};
$('next').onclick=function(){
 var s=steps[i];
 if(s.k==='city'&&A.city!=='Павлодар'){$('err').textContent='Набор доступен только для жителей Павлодара.';return}
 if(!valid())return;
 hist.push(i);advance();
};
$('back').onclick=function(){if(hist.length){i=hist.pop();render()}};
function text(){
 var l=['Заявка в команду «Белая Шапка»','Имя: '+A.name,'Город: '+A.city,'Возраст: '+A.age,
  'Маска: '+(A.hasMask==='Да'?'есть — '+(A.maskOther||A.mask):'нет'),
  'Опыт съёмок: '+A.exp,'Хочу заниматься: '+A.role,
  'Почему хочу в команду: '+A.why.trim(),'Готов сниматься: '+A.when,'Буду добр к коллективу: '+A.kind];
 return l.join('\n');
}
function finish(){
 $('bar').style.width='100%';
 var t=text();$('preview').textContent=t;
 var link=BOT+'?text='+encodeURIComponent(t);
 $('tg').href=link;show('done');
 try{window.open(link,'_blank')}catch(e){}
 $('copy').onclick=function(){
  var ok=function(){$('copy').textContent='Скопировано'};
  try{navigator.clipboard.writeText(t).then(ok,function(){})}catch(e){}
 };
}
</script>
</body>
</html>
